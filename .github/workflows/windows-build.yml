
name: Build Steppefall for Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Side scroller/requirements.txt"

      - name: Build Steppefall
        working-directory: Side scroller
        run: |
          pyinstaller --noconfirm --clean --name "Steppefall" --windowed --add-data "assets;assets" --add-data "settings.json;." --add-data "texts.json;." --add-data "world_save.json;." Main.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Steppefall-Windows
          path: Side scroller/dist/Steppefall/
