
name: Build and Publish Steppefall

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          python -m pip install -r "Side scroller/requirements.txt"

      - name: Build Mac version
        working-directory: Side scroller
        run: |
          pyinstaller --noconfirm --clean --name "Steppefall-mac" --windowed --icon "assets/images/Cover.png" --add-data "assets:assets" --add-data "settings.json:." --add-data "texts.json:." --add-data "world_save.json:." Main.py

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steppefall-Mac
          path: Side scroller/dist/Steppefall-mac.app

      - name: Set up Butler
        uses: remarkablegames/setup-butler@v3

      - name: Publish Mac build
        run: butler push "Side scroller/dist/Steppefall-mac.app" steppefall/steppefall:osx
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Side scroller/requirements.txt"
          python -m pip install pillow

      - name: Create Windows icon
        working-directory: Side scroller
        run: |
          python -c "from PIL import Image; Image.open('assets/images/Cover.png').convert('RGBA').save('assets/images/cover.ico', format='ICO', sizes=[(256,256)])"

      - name: Build Windows version
        working-directory: Side scroller
        run: |
          pyinstaller --noconfirm --clean --name "Steppefall-windows" --windowed --icon "assets/images/cover.ico" --add-data "assets;assets" --add-data "settings.json;." --add-data "texts.json;." --add-data "world_save.json;." Main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steppefall-Windows
          path: Side scroller/dist/Steppefall-windows/

      - name: Set up Butler
        uses: remarkablegames/setup-butler@v3

      - name: Publish Windows build
        run: butler push "Side scroller/dist/Steppefall-windows" steppefall/steppefall:windows
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Side scroller/requirements.txt"

      - name: Build Linux version
        working-directory: Side scroller
        run: |
          pyinstaller --noconfirm --clean --name "Steppefall-linux" --windowed --add-data "assets:assets" --add-data "settings.json:." --add-data "texts.json:." --add-data "world_save.json:." Main.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steppefall-Linux
          path: Side scroller/dist/Steppefall-linux/

      - name: Set up Butler
        uses: remarkablegames/setup-butler@v3

      - name: Publish Linux build
        run: butler push "Side scroller/dist/Steppefall-linux" steppefall/steppefall:linux
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
