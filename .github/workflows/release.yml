
name: Build and Publish Steppefall

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Side scroller/requirements.txt"

      - name: Create Mac icon
        working-directory: Side scroller
        run: |
          sips -s format icns assets/images/cover.png --out assets/images/cover.icns

      - name: Build Mac version
        working-directory: Side scroller
        run: |
          pyinstaller --noconfirm --clean --name "Steppefall" --windowed --icon "assets/images/cover.icns" --add-data "assets:assets" --add-data "settings.json:." --add-data "texts.json:." --add-data "world_save.json:." Main.py

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steppefall-Mac
          path: Side scroller/dist/Steppefall.app

      - name: Set up Butler
        uses: remarkablegames/setup-butler@v3

      - name: Publish Mac test build
        run: butler push "Side scroller/dist/Steppefall.app" steppefall/steppefall:macos-test
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Side scroller/requirements.txt"
          python -m pip install pillow

      - name: Create Windows icon
        working-directory: Side scroller
        run: |
          python -c "from PIL import Image; Image.open('assets/images/cover.png').convert('RGBA').save('assets/images/cover.ico', format='ICO', sizes=[(256,256)])"

      - name: Build Windows version
        working-directory: Side scroller
        run: |
          pyinstaller --noconfirm --clean --name "Steppefall" --windowed --icon "assets/images/cover.ico" --add-data "assets;assets" --add-data "settings.json;." --add-data "texts.json;." --add-data "world_save.json;." Main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steppefall-Windows
          path: Side scroller/dist/Steppefall/

      - name: Set up Butler
        uses: remarkablegames/setup-butler@v3

      - name: Publish Windows test build
        run: butler push "Side scroller/dist/Steppefall" steppefall/steppefall:windows-test
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
